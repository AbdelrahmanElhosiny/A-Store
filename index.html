<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/svg/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Store</title>
    <meta
      name="description"
      content="A-Store: a demo shop with a buy side and a sell side. Browse items, fill a cart and track orders, or list items and follow what sold."
    />
    <meta name="theme-color" content="#fbf1c7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#282828" media="(prefers-color-scheme: dark)" />
    <script>
      // apply a saved light/dark choice before the first paint (no flash)
      try {
        var theme = localStorage.getItem("a-store-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
